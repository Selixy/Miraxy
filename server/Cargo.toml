[package]
name = "miraxy-server"
description = "Miraxy : serveur"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
tower-http = { version = "0.6.6", features = ["fs", "set-header"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "time", "derive"] }
sha2 = "0.11.1"
time = "0.3.55"
serde_json = "1.0.154"
axum-extra = { version = "0.12.6", features = ["cookie"] }
argon2 = "0.6"
uuid = { version = "1", features = ["v4", "serde"] }
getrandom = "0.4"

[dependencies.miraxy-common]
path = "../common"

[dev-dependencies]
http-body-util = "0.1.5"
tower = "0.5.3"
