# Questions posées par setup.sh, dans l'ordre.
# Format : CLÉ|valeur par défaut|expression régulière de validation|question
# Chaque clé devient un @CLÉ@ utilisable dans deploy/templates/.
SSH_DEPLOY|vps-deploy|^[A-Za-z0-9._-]+$|Alias SSH du compte qui fait tourner les conteneurs
SSH_ADMIN|vps|^[A-Za-z0-9._-]+$|Alias SSH du compte avec sudo (pour nginx)
DOMAIN|miraxy.example.org|^[a-z0-9.-]+\.[a-z]{2,}$|Nom de domaine public
HOST_PORT|7101|^[0-9]{2,5}$|Port local du VPS (127.0.0.1) vers lequel nginx redirige
CONTAINER_UID|10021|^[0-9]{4,6}$|Identifiant (uid) de l'utilisateur dans le conteneur
MEMORY_LIMIT|512mb|^[0-9]+[mg]b$|Mémoire maximale du conteneur
DB_MEMORY_LIMIT|512mb|^[0-9]+[mg]b$|Mémoire maximale du conteneur PostgreSQL
TLS_CERT|/etc/ssl/miraxy/miraxy.crt|^/.+$|Chemin du certificat TLS sur le VPS
TLS_KEY|/etc/ssl/miraxy/miraxy.key|^/.+$|Chemin de la clé TLS sur le VPS
TLS_LISTEN|443|^(127\.0\.0\.1:)?[0-9]{2,5}$|Port d'écoute TLS de nginx (443, ou 127.0.0.1:8443 derrière un routeur SNI)
GIT_REMOTE|vps|^[A-Za-z0-9._-]+$|Nom du remote git local à créer
